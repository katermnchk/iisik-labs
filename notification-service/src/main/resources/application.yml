server:
  port: ${PORT:8095}
  address: ${SERVER_ADDRESS:127.0.0.1}
spring:
  application:
    name: notification-service
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:6543/notification_db}
    username: ${DB_USER:notification_app}
    password: ${DB_PASSWORD:notification_demo}
    hikari:
      maximum-pool-size: 3
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
management:
  endpoints:
    web:
      exposure:
        include: health,info
