name: iisik-labs567
services:
  postgres:
    image: postgres:16.15
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: local_demo_admin
    ports: ["127.0.0.1:6543:5432"]
    volumes:
      - travel_postgres:/var/lib/postgresql/data
      - ./docker/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 3s
      timeout: 3s
      retries: 30
  redis:
    image: redis:7.2.4
    ports: ["127.0.0.1:6391:6379"]
    command: ["redis-server", "--appendonly", "yes"]
    volumes: ["travel_redis:/data"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 2s
      retries: 30
  kafka:
    image: apache/kafka:3.7.0
    ports: ["127.0.0.1:9192:9192"]
    environment:
      KAFKA_HEAP_OPTS: "-Xms128m -Xmx256m"
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093,EXTERNAL://:9192
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,EXTERNAL://localhost:9192
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
      KAFKA_LOG_DIRS: /var/lib/kafka/data
    volumes: ["travel_kafka:/var/lib/kafka/data"]
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list >/dev/null 2>&1"]
      interval: 5s
      timeout: 5s
      retries: 30
  user-service:
    image: eclipse-temurin:17-jre
    profiles: [full]
    working_dir: /app
    command: ["java", "-Xmx192m", "-jar", "/app/app.jar"]
    volumes: ["./user-service/target/user-service-1.0.0.jar:/app/app.jar:ro"]
    ports: ["127.0.0.1:8091:8091", "127.0.0.1:9091:9091"]
    environment:
      SERVER_ADDRESS: 0.0.0.0
      SERVICE_KEY: ${SERVICE_KEY:?Run python3 scripts/prepare-env.py}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      KAFKA_BOOTSTRAP: kafka:9092
      USER_RPC: user-service:9091
      TOUR_RPC: tour-service:9092
      BOOKING_RPC: booking-service:9093
      PAYMENT_RPC: payment-service:9094
      NOTIFICATION_RPC: notification-service:9095
      ANALYTICS_RPC: analytics-service:9096
      AUTH_URL: http://auth-service:8190
      DB_URL: jdbc:postgresql://postgres:5432/user_db
      DB_USER: user_app
      DB_PASSWORD: user_demo
    depends_on:
      postgres: {condition: service_healthy}
      redis: {condition: service_healthy}
      kafka: {condition: service_healthy}
  tour-service:
