syntax = "proto3";

package travel.v1;

option java_package = "by.bsuir.travel.proto.v1";

option java_multiple_files = true;

import "google/protobuf/timestamp.proto";

message DateValue { int32 year = 1; int32 month = 2; int32 day = 3; }

enum RoleCode { ROLE_CODE_UNSPECIFIED = 0; ROLE_CODE_CLIENT = 1; ROLE_CODE_EMPLOYEE = 2; ROLE_CODE_ADMIN = 3; }

enum UserStatus { USER_STATUS_UNSPECIFIED = 0; USER_STATUS_ACTIVE = 1; USER_STATUS_BLOCKED = 2; }

enum TourStatus { TOUR_STATUS_UNSPECIFIED = 0; TOUR_STATUS_DRAFT = 1; TOUR_STATUS_PUBLISHED = 2; TOUR_STATUS_ARCHIVED = 3; }

enum ScheduleStatus { SCHEDULE_STATUS_UNSPECIFIED = 0; SCHEDULE_STATUS_OPEN = 1; SCHEDULE_STATUS_CLOSED = 2; SCHEDULE_STATUS_CANCELLED = 3; }

enum TransportKind { TRANSPORT_KIND_UNSPECIFIED = 0; TRANSPORT_KIND_AIR = 1; TRANSPORT_KIND_RAIL = 2; TRANSPORT_KIND_BUS = 3; TRANSPORT_KIND_OTHER = 4; }

enum BookingStatus { BOOKING_STATUS_UNSPECIFIED = 0; BOOKING_STATUS_RESERVING = 1; BOOKING_STATUS_PENDING_PAYMENT = 2; BOOKING_STATUS_CONFIRMED = 3; BOOKING_STATUS_EXPIRED = 4; BOOKING_STATUS_CANCELLING = 5; BOOKING_STATUS_REFUND_PENDING = 6; BOOKING_STATUS_CANCELLED = 7; BOOKING_STATUS_COMPLETED = 8; BOOKING_STATUS_REJECTED = 9; }

enum PaymentStatus { PAYMENT_STATUS_UNSPECIFIED = 0; PAYMENT_STATUS_PENDING = 1; PAYMENT_STATUS_SUCCEEDED = 2; PAYMENT_STATUS_FAILED = 3; PAYMENT_STATUS_REFUND_PENDING = 4; PAYMENT_STATUS_REFUNDED = 5; }

enum RefundStatus { REFUND_STATUS_UNSPECIFIED = 0; REFUND_STATUS_PENDING = 1; REFUND_STATUS_SUCCEEDED = 2; REFUND_STATUS_FAILED = 3; }

enum NotificationKind { NOTIFICATION_KIND_UNSPECIFIED = 0; NOTIFICATION_KIND_WELCOME = 1; NOTIFICATION_KIND_BOOKING_STATUS = 2; NOTIFICATION_KIND_TOUR_CHANGE = 3; NOTIFICATION_KIND_PAYMENT_STATUS = 4; }

enum DeliveryStatus { DELIVERY_STATUS_UNSPECIFIED = 0; DELIVERY_STATUS_PENDING = 1; DELIVERY_STATUS_SENT = 2; DELIVERY_STATUS_FAILED = 3; }

enum TourSortField { TOUR_SORT_FIELD_UNSPECIFIED = 0; TOUR_SORT_FIELD_STARTS_AT = 1; TOUR_SORT_FIELD_PRICE = 2; TOUR_SORT_FIELD_DURATION = 3; TOUR_SORT_FIELD_POPULARITY = 4; }

enum SortDirection { SORT_DIRECTION_UNSPECIFIED = 0; SORT_DIRECTION_ASC = 1; SORT_DIRECTION_DESC = 2; }

message Money { int64 amount_minor = 1; optional string currency = 2; }

message Role { optional RoleCode code = 1; optional string name = 2; }

message ClientProfile { optional string user_id = 1; optional string phone = 2; }

message EmployeeProfile { optional string user_id = 1; optional string position = 2; }

message User { optional string id = 1; Role role = 2; optional string email = 3; optional string first_name = 4; optional string last_name = 5; optional UserStatus status = 6; ClientProfile client_profile = 7; EmployeeProfile employee_profile = 8; }

message Principal { optional string user_id = 1; optional RoleCode role = 2; optional UserStatus status = 3; optional string email = 4; optional string client_id = 5; optional string employee_id = 6; }

message Direction { optional string id = 1; optional string country = 2; optional string city = 3; optional string description = 4; bool is_active = 5; }

message Accommodation { optional string id = 1; optional string schedule_id = 2; optional string name = 3; optional string address = 4; google.protobuf.Timestamp check_in_at = 5; google.protobuf.Timestamp check_out_at = 6; optional string room_type = 7; }

message Transport { optional string id = 1; optional string schedule_id = 2; optional TransportKind kind = 3; optional string carrier = 4; optional string route_number = 5; google.protobuf.Timestamp departure_at = 6; google.protobuf.Timestamp arrival_at = 7; }

message TourSchedule { optional string id = 1; optional string tour_id = 2; google.protobuf.Timestamp starts_at = 3; google.protobuf.Timestamp ends_at = 4; int32 capacity = 5; int32 reserved_seats = 6; int32 available_seats = 7; Money price = 8; int64 price_version = 9; int64 version = 10; optional ScheduleStatus status = 11; repeated Accommodation accommodations = 12; repeated Transport transports = 13; }

message Tour { optional string id = 1; Direction direction = 2; optional string title = 3; optional string description = 4; int32 duration_days = 5; optional TourStatus status = 6; int64 version = 7; optional string created_by_employee_id = 8; repeated TourSchedule schedules = 9; }

message Payment { optional string id = 1; optional string booking_id = 2; Money amount = 3; optional PaymentStatus status = 4; optional string payment_url = 5; google.protobuf.Timestamp created_at = 6; }

message Booking { optional string id = 1; optional string client_id = 2; optional string schedule_id = 3; optional string direction_id = 4; optional string tour_title = 5; optional string direction_name = 6; google.protobuf.Timestamp starts_at = 7; int32 traveler_count = 8; Money unit_price = 9; Money total = 10; optional BookingStatus status = 11; google.protobuf.Timestamp hold_expires_at = 12; google.protobuf.Timestamp created_at = 13; int64 version = 14; repeated Payment payments = 15; }

message Notification { optional string id = 1; optional string user_id = 2; optional string booking_id = 3; optional NotificationKind kind = 4; optional string title = 5; optional string body = 6; optional DeliveryStatus status = 7; google.protobuf.Timestamp created_at = 8; }

message PageInfo { int32 page = 1; int32 size = 2; bool has_next = 3; }

message TourFilter { optional string direction_id = 1; DateValue from = 2; DateValue to = 3; optional int64 min_price = 4; optional int64 max_price = 5; optional bool only_available = 6; }

message TourSort { optional TourSortField field = 1; optional SortDirection direction = 2; }

message AnalyticsFilter { google.protobuf.Timestamp from = 1; google.protobuf.Timestamp to = 2; }

message DirectionPopularity { optional string direction_id = 1; optional string direction_name = 2; int32 confirmed_tourists = 3; int32 rank = 4; }

message SalesAnalytics { Money gross_sales = 1; Money refunded = 2; Money net_sales = 3; double occupancy = 4; repeated DirectionPopularity directions = 5; google.protobuf.Timestamp as_of = 6; }

message GetPrincipalRequest { optional string access_token = 1; }

message GetUserRequest { optional string user_id = 1; }

message ListDirectionsRequest { bool active_only = 1; }

message ListToursRequest { TourFilter filter = 1; TourSort sort = 2; PageInput page = 3; repeated DirectionPopularity popularity = 4; google.protobuf.Timestamp popularity_as_of = 5; }

message GetTourRequest { optional string tour_id = 1; optional RoleCode viewer_role = 2; }

message GetBookingRequest { optional string booking_id = 1; }

message ListBookingsRequest { optional string client_id = 1; PageInput page = 2; }

message ListPaymentsRequest { repeated string booking_ids = 1; }

message ListNotificationsRequest { optional string user_id = 1; PageInput page = 2; }

message PageInput { int32 page = 1; int32 size = 2; }

message TourConnection { repeated Tour items = 1; int32 total_count = 2; PageInfo page = 3; google.protobuf.Timestamp popularity_as_of = 4; }

message BookingConnection { repeated Booking items = 1; int32 total_count = 2; PageInfo page = 3; }

message NotificationConnection { repeated Notification items = 1; int32 total_count = 2; PageInfo page = 3; }

message GetPrincipalResponse { Principal principal = 1; }

message GetUserResponse { User user = 1; }

message GetClientProfileRequest { optional string client_id = 1; }

message GetClientProfileResponse { User user = 1; }

message CreateUserRequest { optional string email = 1; optional string password = 2; optional string first_name = 3; optional string last_name = 4; optional string phone = 5; }

message AuthResponse { optional string access_token = 1; User user = 2; }

message AuthenticateRequest { optional string email = 1; optional string password = 2; }

message EmployeeProfileInput { optional string position = 1; }

message ClientProfileInput { optional string phone = 1; }

message UpdateUserRequest { optional string user_id = 1; optional RoleCode role = 2; optional UserStatus status = 3; optional string first_name = 4; optional string last_name = 5; EmployeeProfileInput employee_profile = 6; ClientProfileInput client_profile = 7; Principal actor = 8; }

message GetTourResponse { Tour tour = 1; }

message ListDirectionsResponse { repeated Direction directions = 1; }

message CreateTourRequest { optional string direction_id = 1; optional string title = 2; optional string description = 3; int32 duration_days = 4; optional string created_by_employee_id = 5; Principal actor = 6; }

message UpdateTourRequest { optional string tour_id = 1; optional string title = 2; optional string description = 3; optional int32 duration_days = 4; optional TourStatus status = 5; int64 expected_version = 6; Principal actor = 7; }

message CreateScheduleRequest { optional string tour_id = 1; google.protobuf.Timestamp starts_at = 2; google.protobuf.Timestamp ends_at = 3; int32 capacity = 4; Money price = 5; Principal actor = 6; }

message ScheduleResponse { TourSchedule schedule = 1; }

message UpdateScheduleRequest { optional string schedule_id = 1; google.protobuf.Timestamp starts_at = 2; google.protobuf.Timestamp ends_at = 3; optional int32 capacity = 4; Money price = 5; optional ScheduleStatus status = 6; int64 expected_version = 7; Principal actor = 8; }

message AddAccommodationRequest { optional string schedule_id = 1; optional string name = 2; optional string address = 3; google.protobuf.Timestamp check_in_at = 4; google.protobuf.Timestamp check_out_at = 5; optional string room_type = 6; }

message AccommodationResponse { Accommodation accommodation = 1; }

message AddTransportRequest { optional string schedule_id = 1; optional TransportKind kind = 2; optional string carrier = 3; optional string route_number = 4; google.protobuf.Timestamp departure_at = 5; google.protobuf.Timestamp arrival_at = 6; }

message TransportResponse { Transport transport = 1; }

message UpsertDirectionRequest { optional string direction_id = 1; optional string country = 2; optional string city = 3; optional string description = 4; bool is_active = 5; }

message DirectionResponse { Direction direction = 1; }

message ReserveSeatsRequest { optional string booking_id = 1; optional string schedule_id = 2; int32 seats = 3; int64 expected_price_version = 4; }

message ReserveSeatsResponse { Tour tour = 13; TourSchedule schedule = 14; optional string booking_id = 1; optional string schedule_id = 2; int32 seats = 3; Money unit_price = 4; Money total = 5; google.protobuf.Timestamp expires_at = 6; int64 price_version = 7; optional string tour_id = 8; optional string direction_id = 9; optional string tour_title = 10; optional string direction_name = 11; google.protobuf.Timestamp starts_at = 12; }

message ConfirmReservationRequest { optional string booking_id = 1; }

message ReservationResponse { optional string booking_id = 1; optional string schedule_id = 2; int32 seats = 3; optional string status = 4; }

message ReleaseReservationRequest { optional string booking_id = 1; optional string reason = 2; }

message BookingResponse { Booking booking = 1; }

message ListScheduleRecipientsRequest { optional string schedule_id = 1; }

message ListScheduleRecipientsResponse { repeated string user_ids = 1; }

message CreateBookingRequest { optional string client_id = 1; optional string schedule_id = 2; int32 traveler_count = 3; int64 expected_price_version = 4; optional string idempotency_key = 5; Principal actor = 6; }

message CancelBookingRequest { optional string booking_id = 1; optional string user_id = 2; optional string reason = 3; optional string idempotency_key = 4; Principal actor = 5; }

message ChangeBookingStatusRequest { optional string booking_id = 1; optional string user_id = 2; optional BookingStatus target_status = 3; optional string reason = 4; int64 expected_version = 5; Principal actor = 6; }

message PaymentContextRequest { optional string booking_id = 1; optional string user_id = 2; }

message PaymentContextResponse { optional string booking_id = 1; optional string client_id = 2; optional string schedule_id = 3; optional string direction_id = 4; Money total = 5; optional BookingStatus booking_status = 6; google.protobuf.Timestamp hold_expires_at = 7; }

message PaymentOutcome { optional PaymentStatus status = 1; Money paid_amount = 2; }

message ApplyPaymentResultRequest { optional string payment_id = 1; optional string booking_id = 2; optional string provider_event_id = 3; PaymentOutcome outcome = 4; }

message ApplyRefundResultRequest { optional string refund_id = 1; optional string payment_id = 2; optional string booking_id = 3; optional RefundStatus status = 4; Money total_refunded = 5; }

message ListPaymentsResponse { repeated Payment payments = 1; }

message CreatePaymentRequest { optional string booking_id = 1; optional string user_id = 2; optional string idempotency_key = 3; Principal actor = 4; }

message PaymentResponse { Payment payment = 1; }

message Refund { optional string refund_id = 1; optional string payment_id = 2; Money amount = 3; optional RefundStatus status = 4; optional string provider_refund_id = 5; google.protobuf.Timestamp created_at = 6; }

message RequestRefundRequest { optional string payment_id = 1; optional string booking_id = 2; Money amount = 3; optional string idempotency_key = 4; optional string reason = 5; }

message RefundResponse { Refund refund = 1; }

message GetSalesAnalyticsRequest { AnalyticsFilter filter = 1; }

message SalesAnalyticsResponse { SalesAnalytics analytics = 1; }

message GetPopularityRequest { google.protobuf.Timestamp from = 1; google.protobuf.Timestamp to = 2; }

message GetPopularityResponse { repeated DirectionPopularity directions = 1; optional string snapshot_id = 2; google.protobuf.Timestamp as_of = 3; }

service UserService {
 rpc RegisterProfile(RegisterProfileRequest) returns (GetUserResponse);
 rpc GetPrincipal(GetPrincipalRequest) returns (GetPrincipalResponse);
 rpc GetUser(GetUserRequest) returns (GetUserResponse);
 rpc GetClientProfile(GetClientProfileRequest) returns (GetClientProfileResponse);
 rpc CreateUser(CreateUserRequest) returns (AuthResponse);
 rpc Authenticate(AuthenticateRequest) returns (AuthResponse);
 rpc UpdateUser(UpdateUserRequest) returns (GetUserResponse);
}

service TourService {
 rpc GetSchedule(GetScheduleRequest) returns (ScheduleResponse);
 rpc ListTours(ListToursRequest) returns (TourConnection);
 rpc GetTour(GetTourRequest) returns (GetTourResponse);
 rpc ListDirections(ListDirectionsRequest) returns (ListDirectionsResponse);
 rpc CreateTour(CreateTourRequest) returns (GetTourResponse);
 rpc UpdateTour(UpdateTourRequest) returns (GetTourResponse);
 rpc CreateSchedule(CreateScheduleRequest) returns (ScheduleResponse);
 rpc UpdateSchedule(UpdateScheduleRequest) returns (ScheduleResponse);
 rpc AddAccommodation(AddAccommodationRequest) returns (AccommodationResponse);
 rpc AddTransport(AddTransportRequest) returns (TransportResponse);
 rpc UpsertDirection(UpsertDirectionRequest) returns (DirectionResponse);
 rpc ReserveSeats(ReserveSeatsRequest) returns (ReserveSeatsResponse);
 rpc ConfirmReservation(ConfirmReservationRequest) returns (ReservationResponse);
 rpc ReleaseReservation(ReleaseReservationRequest) returns (ReservationResponse);
}

service BookingService {
 rpc FilterBookings(FilterBookingsRequest) returns (BookingConnection);
 rpc SummarizeBookings(FilterBookingsRequest) returns (BookingSummary);
 rpc ClaimPayment(PaymentClaimRequest) returns (BooleanResponse);
 rpc ExpireBooking(BookingIdRequest) returns (BooleanResponse);
 rpc ReleaseOrphanReservation(BookingIdRequest) returns (BooleanResponse);
 rpc GetBooking(GetBookingRequest) returns (BookingResponse);
 rpc ListClientBookings(ListBookingsRequest) returns (BookingConnection);
 rpc ListScheduleRecipients(ListScheduleRecipientsRequest) returns (ListScheduleRecipientsResponse);
 rpc CreateBooking(CreateBookingRequest) returns (BookingResponse);
 rpc CancelBooking(CancelBookingRequest) returns (BookingResponse);
 rpc ChangeBookingStatus(ChangeBookingStatusRequest) returns (BookingResponse);
 rpc GetPaymentContext(PaymentContextRequest) returns (PaymentContextResponse);
 rpc ApplyPaymentResult(ApplyPaymentResultRequest) returns (BookingResponse);
 rpc ApplyRefundResult(ApplyRefundResultRequest) returns (BookingResponse);
}

service PaymentService {
 rpc ConfirmPayment(ConfirmPaymentRequest) returns (PaymentResponse);
 rpc ExpirePayment(BookingIdRequest) returns (BooleanResponse);
 rpc ListBookingPayments(ListPaymentsRequest) returns (ListPaymentsResponse);
 rpc CreatePayment(CreatePaymentRequest) returns (PaymentResponse);
 rpc RequestRefund(RequestRefundRequest) returns (RefundResponse);
}

service NotificationService {
 rpc ListUserNotifications(ListNotificationsRequest) returns (NotificationConnection);
}

service AnalyticsService {
 rpc GetSalesAnalytics(GetSalesAnalyticsRequest) returns (SalesAnalyticsResponse);
 rpc GetPopularity(GetPopularityRequest) returns (GetPopularityResponse);
}

// Executed LR5-7 extensions to the LR2 service contract.
message RegisterProfileRequest { optional string id = 1; optional string email = 2; optional string first_name = 3; optional string last_name = 4; optional string phone = 5; }
message GetScheduleRequest { optional string id = 1; }
message BookingFilter { optional BookingStatus status = 1; google.protobuf.Timestamp from = 2; google.protobuf.Timestamp to = 3; }
enum BookingSortField { BOOKING_SORT_FIELD_UNSPECIFIED = 0; BOOKING_SORT_FIELD_CREATED_AT = 1; BOOKING_SORT_FIELD_TOTAL = 2; BOOKING_SORT_FIELD_STARTS_AT = 3; }
message BookingSort { optional BookingSortField field = 1; optional SortDirection direction = 2; }
message FilterBookingsRequest { Principal actor = 1; BookingFilter filter = 2; BookingSort sort = 3; }
message BookingSummary { int32 count = 1; int32 pending = 2; int32 confirmed = 3; int32 cancelled = 4; Money total = 5; }
message PaymentClaimRequest { optional string booking_id = 1; optional string payment_id = 2; Principal actor = 3; }
message BooleanResponse { bool value = 1; }
message ConfirmPaymentRequest { optional string payment_id = 1; Principal actor = 2; }
message BookingIdRequest { optional string booking_id = 1; }
