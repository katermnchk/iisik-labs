{
  "name": "iisik-lab3-review",
  "services": {
    "postgres": {
      "image": "postgres:16.15",
      "environment": {
        "POSTGRES_USER": "postgres",
        "POSTGRES_PASSWORD": "local_demo_admin"
      },
      "ports": [
        "127.0.0.1:6643:5432"
      ],
      "volumes": [
        "lab3_postgres:/var/lib/postgresql/data",
        "./docker/init:/docker-entrypoint-initdb.d:ro"
      ],
      "healthcheck": {
        "test": [
          "CMD-SHELL",
          "pg_isready -U postgres"
        ],
        "interval": "5s",
        "timeout": "3s",
        "retries": 20
      }
    },
    "user-service": {
      "image": "eclipse-temurin:17-jre",
      "volumes": [
        "./user-service/target/user-service-1.0.0.jar:/app/app.jar:ro"
      ],
      "entrypoint": [
        "java",
        "-jar",
        "/app/app.jar"
      ],
      "environment": {
        "SERVER_ADDRESS": "0.0.0.0",
        "DB_URL": "jdbc:postgresql://postgres:5432/user_db",
        "DB_USER": "user_app",
        "DB_PASSWORD": "user_demo"
      },
      "ports": [
        "127.0.0.1:8291:8091"
      ],
      "depends_on": {
        "postgres": {
          "condition": "service_healthy"
        }
      }
    },
    "tour-service": {
      "image": "eclipse-temurin:17-jre",
      "volumes": [
        "./tour-service/target/tour-service-1.0.0.jar:/app/app.jar:ro"
      ],
      "entrypoint": [
        "java",
        "-jar",
        "/app/app.jar"
      ],
      "environment": {
        "SERVER_ADDRESS": "0.0.0.0",
        "DB_URL": "jdbc:postgresql://postgres:5432/tour_db",
        "DB_USER": "tour_app",
        "DB_PASSWORD": "tour_demo"
      },
      "ports": [
        "127.0.0.1:8292:8092"
      ],
      "depends_on": {
        "postgres": {
          "condition": "service_healthy"
        }
      }
    },
    "booking-service": {
      "image": "eclipse-temurin:17-jre",
      "volumes": [
        "./booking-service/target/booking-service-1.0.0.jar:/app/app.jar:ro"
      ],
      "entrypoint": [
        "java",
        "-jar",
        "/app/app.jar"
      ],
      "environment": {
        "SERVER_ADDRESS": "0.0.0.0",
        "DB_URL": "jdbc:postgresql://postgres:5432/booking_db",
        "DB_USER": "booking_app",
        "DB_PASSWORD": "booking_demo"
      },
      "ports": [
        "127.0.0.1:8293:8093"
      ],
      "depends_on": {
        "postgres": {
          "condition": "service_healthy"
        }
      }
    },
    "payment-service": {
      "image": "eclipse-temurin:17-jre",
      "volumes": [
        "./payment-service/target/payment-service-1.0.0.jar:/app/app.jar:ro"
      ],
      "entrypoint": [
        "java",
        "-jar",
        "/app/app.jar"
      ],
      "environment": {
        "SERVER_ADDRESS": "0.0.0.0",
        "DB_URL": "jdbc:postgresql://postgres:5432/payment_db",
        "DB_USER": "payment_app",
        "DB_PASSWORD": "payment_demo"
      },
      "ports": [
        "127.0.0.1:8294:8094"
      ],
      "depends_on": {
        "postgres": {
          "condition": "service_healthy"
        }
      }
    },
    "notification-service": {
      "image": "eclipse-temurin:17-jre",
      "volumes": [
        "./notification-service/target/notification-service-1.0.0.jar:/app/app.jar:ro"
      ],
      "entrypoint": [
        "java",
        "-jar",
        "/app/app.jar"
      ],
      "environment": {
        "SERVER_ADDRESS": "0.0.0.0",
        "DB_URL": "jdbc:postgresql://postgres:5432/notification_db",
        "DB_USER": "notification_app",
        "DB_PASSWORD": "notification_demo"
      },
      "ports": [
        "127.0.0.1:8295:8095"
      ],
      "depends_on": {
        "postgres": {
          "condition": "service_healthy"
        }
      }
    },
    "analytics-service": {
      "image": "eclipse-temurin:17-jre",
      "volumes": [
        "./analytics-service/target/analytics-service-1.0.0.jar:/app/app.jar:ro"
      ],
      "entrypoint": [
        "java",
        "-jar",
        "/app/app.jar"
      ],
      "environment": {
        "SERVER_ADDRESS": "0.0.0.0",
        "DB_URL": "jdbc:postgresql://postgres:5432/analytics_db",
        "DB_USER": "analytics_app",
        "DB_PASSWORD": "analytics_demo"
      },
      "ports": [
        "127.0.0.1:8296:8096"
      ],
      "depends_on": {
        "postgres": {
          "condition": "service_healthy"
        }
      }
    },
    "graphql-api": {
      "image": "eclipse-temurin:17-jre",
      "volumes": [
        "./graphql-api/target/graphql-api-1.0.0.jar:/app/app.jar:ro"
      ],
      "entrypoint": [
        "java",
        "-jar",
        "/app/app.jar"
      ],
      "environment": {
        "SERVER_ADDRESS": "0.0.0.0"
      },
      "ports": [
        "127.0.0.1:8280:8080"
      ]
    }
  },
  "volumes": {
    "lab3_postgres": {}
  }
}
