server:
  port: ${PORT:8096}
  address: ${SERVER_ADDRESS:127.0.0.1}
spring:
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6391}
      timeout: 1s
      connect-timeout: 1s
  application:
    name: analytics-service
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:6543/analytics_db}
    username: ${DB_USER:analytics_app}
    password: ${DB_PASSWORD:analytics_demo}
    hikari:
      maximum-pool-size: 3
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
management:
  endpoints:
    web:
      exposure:
        include: health,info

  # transport configuration is read from the shared EventConfig
