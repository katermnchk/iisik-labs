server:
  port: ${PORT:8093}
  address: ${SERVER_ADDRESS:127.0.0.1}
spring:
  application:
    name: booking-service
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:6543/booking_db}
    username: ${DB_USER:booking_app}
    password: ${DB_PASSWORD:booking_demo}
    hikari:
      maximum-pool-size: 3
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
management:
  endpoints:
    web:
      exposure:
        include: health,info
