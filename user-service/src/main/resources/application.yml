server:
  port: ${PORT:8091}
  address: ${SERVER_ADDRESS:127.0.0.1}
spring:
  application:
    name: user-service
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:6543/user_db}
    username: ${DB_USER:user_app}
    password: ${DB_PASSWORD:user_demo}
    hikari:
      maximum-pool-size: 3
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
management:
  endpoints:
    web:
      exposure:
        include: health,info
